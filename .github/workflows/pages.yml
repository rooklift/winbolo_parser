name: Deploy viewer to GitHub Pages

# Publishes the web version of the viewer (the viewer/ directory, served
# as static files) at https://rooklift.github.io/winbolo_parser/.
# Runs on every push to main that touches the viewer, or by hand from the
# Actions tab.
#
# One-off setup: in the repository's Settings > Pages, the source must be
# set to "GitHub Actions" (not "Deploy from a branch"), or the deploy step
# fails. The site is served over HTTPS and is public.
#
# The whole viewer/ directory is uploaded as is. The Electron-only files in
# it (main.js, preload.js, builder.py, the tauri/ folder) are harmless
# there: index.html never loads them, so the browser never asks for them.

on:
  push:
    branches: [main]
    paths:
      - "viewer/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels one still queued.
concurrency:
  group: pages
  cancel-in-progress: true

# The upload and the deploy are separate jobs on purpose. deploy-pages looks
# the artifact up by name in the run's artifact list, and GitHub's list can
# lag an upload by several seconds: as consecutive steps of one job the
# lookup came a third of a second after the upload and found
# nothing ("No artifacts named "github-pages" were found", deploy-pages issue
# 451). A second job starts seconds later. Should the list lag even that, the
# deploy is tried once more after a wait; a lookup that found nothing has
# deployed nothing, so the second try starts clean.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before the second try
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
