[package]
name = "winbolo-replay-viewer"
# The app's real version is viewer/package.json's; tauri.conf.json reads it
# from there, so this one is never shown anywhere.
version = "0.0.0"
description = "WinBolo Replay Viewer: plays back WinBolo game logs"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
